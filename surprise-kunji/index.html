<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>For Kunji 💜</title>
<meta name="description" content="A little love letter made just for you." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="heart-field"></div>

<div class="progress-dots" id="progressDots" aria-hidden="true"></div>

<main class="app" id="app">

  <!-- Splash -->
  <section class="stage active" id="stage-splash">
    <p class="eyebrow reveal">a little something for</p>
    <h1 class="script-font glow reveal" id="splashName">Kunji</h1>
    <p class="lead reveal">There's a story I've been wanting to tell you — our story.<br/>Before your gift, come read it with me 💜</p>
    <button class="btn-main reveal" id="startBtn">Begin 💜</button>
  </section>

  <!-- Story chapters -->
  <section class="stage" id="stage-story">
    <p class="stage-label" id="chapterLabel"></p>
    <div id="chapterContent"></div>
    <button class="btn-main" id="chapterNextBtn">Continue 💜</button>
  </section>

  <!-- Final reveal -->
  <section class="stage" id="stage-final">
    <h1 class="script-font glow reveal">Happy Birthday<br/>Kunji 💜</h1>

    <div class="countdown" id="countdown"></div>

    <div class="photo-gallery" id="photoGallery"></div>

    <div class="love-letter" id="loveLetter"></div>

    <div class="surprise-box">
      <button class="btn-main" id="surpriseBtn">🎁 Tap for one more surprise</button>
      <p class="surprise-text" id="surpriseText" style="display:none"></p>
    </div>

    <p class="signature script-font" id="signature"></p>

    <button class="btn-ghost" id="replayBtn">Replay ↺</button>
  </section>

</main>

<canvas id="confettiCanvas"></canvas>

<script src="assets/script.js"></script>
</body>
</html>
